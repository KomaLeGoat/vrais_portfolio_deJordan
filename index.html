<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

</head>

<body>


  <!-- Black Flash (黒閃) : éclairs noirs et rouges plein écran -->
  <canvas class="black-flash" id="blackFlash" aria-hidden="true"></canvas>
  <div class="bf-kanji" id="bfKanji" aria-hidden="true">黒閃</div>

  <div class="progression" aria-hidden="true"><i id="progression"></i></div>
  <div class="curseur" id="curseur" aria-hidden="true"><i></i></div>

  <!-- ════════════ LIGHTBOX ════════════ -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
    <div class="lb-inner">
      <div class="lb-header">
        <span class="lb-title" id="lbTitle" data-i18n="lb.lb_title"></span>
        <button class="lb-close" id="lbClose" aria-label="" data-i18n-attr="aria-label=lb.aria_label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
        </button>
      </div>
      <div class="lb-body" id="lbBody"></div>
    </div>
  </div>

  <!-- ════════════ SIDEBAR ════════════ -->
  <aside class="sidebar" id="sidebar">
    <button class="sb-toggle" id="sbToggle" aria-label="" data-i18n-attr="aria-label=nav.aria_label">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7" /><polyline points="6 17 11 12 6 7" /></svg>
    </button>
    <a href="#Accueil" class="sb-logo" data-i18n-html="nav.sb_logo"></a>
    <nav class="sb-nav">
      <a href="#Accueil" class="sb-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg>

      </a>
      <a href="#APropos" class="sb-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4" /><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" /></svg>
        <span class="sb-label" data-i18n="nav.lien_2"></span>
      </a>
      <a href="#Formation" class="sb-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z" /><path d="M6 12v5c3 3 9 3 12 0v-5" /></svg>
        <span class="sb-label" data-i18n="nav.lien_3"></span>
      </a>
      <a href="#Outils" class="sb-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" /><line x1="8" y1="21" x2="16" y2="21" /><line x1="12" y1="17" x2="12" y2="21" /></svg>
        <span class="sb-label" data-i18n="nav.lien_4"></span>
      </a>
      <a href="#Projets" class="sb-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></svg>
        <span class="sb-label" data-i18n="nav.lien_5"></span>
      </a>
      <a href="#Stage" class="sb-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2" /><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" /></svg>
        <span class="sb-label" data-i18n="nav.lien_6"></span>
      </a>
      <a href="#Certifications" class="sb-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6" /><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11" /></svg>
        <span class="sb-label" data-i18n="nav.lien_7"></span>
      </a>
      <a href="#Veilles" class="sb-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
        <span class="sb-label" data-i18n="nav.lien_8"></span>
      </a>
      <a href="#Evenements" class="sb-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></svg>
        <span class="sb-label" data-i18n="nav.lien_9"></span>
      </a>
      <a href="#Contact" class="sb-link">

        <span class="sb-label" data-i18n="nav.lien_10"></span>
      </a>
    </nav>
    <div class="sb-footer"></div>
  </aside>

  <main id="contenu">

    <!-- ════════════ HERO ════════════ -->
    <section id="Accueil" data-palier="" class="hero" data-i18n-attr="data-palier=accueil.data_palier">
      <div class="hero-kanji" aria-hidden="true">呪術師</div>

      <div class="hero-layout">
        <div class="hero-content">
          <p class="hero-sur" data-i18n-html="accueil.hero_sur"></p>
          <h1 class="hero-title" aria-label="" data-i18n-attr="aria-label=accueil.aria_label">
            <span class="line"><span class="line-inner" data-i18n="accueil.line_inner"></span></span>
            <span class="line"><span class="line-inner ac" data-i18n-html="accueil.line_inner_2"></span></span>
          </h1>
          <p class="hero-desc" data-i18n-html="accueil.hero_desc"></p>
        </div>
      </div>


      <a href="#APropos" class="scroll-hint" data-i18n-html="accueil.scroll_hint"></a>
    </section>

    <!-- ════════════ À PROPOS DE MOI ════════════ -->
    <section id="APropos" data-palier="" class="sec" data-i18n-attr="data-palier=apropos.data_palier">
      <div class="sec-tete">
        <span class="sec-kanji" aria-hidden="true">壱</span>
        <h2 class="sec-title" data-i18n="apropos.titre"></h2>
        <p class="sec-sub reveal" data-i18n="apropos.sous"></p>
      </div>

      <div class="apropos">
        <article class="ap-ligne reveal">
          <div class="ap-img ap-img--photo encre">
            <img src="images/jordan.webp" alt="" loading="lazy" data-i18n-attr="alt=apropos.alt" />
          </div>
          <div class="ap-texte">
            <h3 data-i18n-html="apropos.h3"></h3>
            <p data-i18n="apropos.p"></p>
            <p data-i18n="apropos.p_2"></p>
          </div>
        </article>

        <article class="ap-ligne ap-ligne--inverse reveal">
          <div class="ap-img ap-img--ds encre">
            <img src="images/pokemon_bw.webp" alt="" loading="lazy" data-i18n-attr="alt=apropos.alt_2" />
          </div>
          <div class="ap-texte">
            <h3 data-i18n-html="apropos.h3_2"></h3>
            <p data-i18n="apropos.p_3"></p>
            <p data-i18n="apropos.p_4"></p>
          </div>
        </article>
      </div>
    </section>

    <!-- ════════════ FORMATION ════════════ -->
    <section id="Formation" data-palier="" class="sec" data-i18n-attr="data-palier=formation.data_palier">
      <div class="sec-tete">
        <span class="sec-kanji" aria-hidden="true">弐</span>
        <h2 class="sec-title" data-i18n="formation.titre"></h2>
        <p class="sec-sub reveal" data-i18n="formation.sous"></p>
      </div>

      <div class="technique reveal">
        <div class="slam3d" id="slam3dBoite">
          <canvas id="slam3d" aria-label="" data-i18n-attr="aria-label=formation.aria_label"></canvas>
          <span class="slam-secours" aria-hidden="true" data-i18n="formation.slam_secours"></span>
          <span class="slam-aide" aria-hidden="true" data-i18n="formation.slam_aide"></span>
        </div>
        <div class="tq-corps">
          <div class="fm-badge" data-i18n="formation.fm_badge"></div>
          <h3 data-i18n="formation.h3"></h3>
          <p data-i18n="formation.p"></p>
          <ul class="fm-list">
            <li data-i18n="formation.li"></li>
            <li data-i18n="formation.li_2"></li>
            <li data-i18n="formation.li_3"></li>
            <li data-i18n="formation.li_4"></li>
            <li data-i18n="formation.li_5"></li>
          </ul>
        </div>
      </div>
    </section>

    <!-- ════════════ OUTILS ════════════ -->
    <section id="Outils" data-palier="" class="sec" data-sans-fenetre data-i18n-attr="data-palier=outils.data_palier">
      <div class="sec-tete">
        <span class="sec-kanji" aria-hidden="true">参</span>
        <h2 class="sec-title" data-i18n="outils.titre"></h2>
        <p class="sec-sub reveal" data-i18n="outils.sous"></p>
      </div>
      <div class="pokedex reveal" id="pokedex">
        <div class="dex-ecran">
          <div class="tools-3d-wrap" id="toolsWrap">
            <div class="tools-3d-scene" id="toolsScene"></div>
          </div>
          <div class="dex-info" aria-live="polite"><span id="dexNum" data-i18n="outils.span"></span><b id="dexNom" data-i18n="outils.b"></b></div>
        </div>
      </div>
    </section>

    <!-- ════════════ PROJETS ════════════ -->
    <section id="Projets" data-palier="" class="sec" data-i18n-attr="data-palier=projets.data_palier">
      <div class="sec-tete">
        <span class="sec-kanji" aria-hidden="true">肆</span>
        <h2 class="sec-title" data-i18n="projets.titre"></h2>
        <p class="sec-sub reveal" data-i18n="projets.sous"></p>
      </div>
      <div class="proj-grid" id="projGrid"></div>
    </section>

    <!-- ════════════ STAGES ════════════ -->
    <section id="Stage" data-palier="" class="sec" data-i18n-attr="data-palier=stages.data_palier">
      <div class="sec-tete">
        <span class="sec-kanji" aria-hidden="true">伍</span>
        <h2 class="sec-title" data-i18n="stages.titre"></h2>
        <p class="sec-sub reveal" id="stageDesc" data-i18n="stages.sous"></p>
      </div>

      <!-- Sélecteur de stage : flèches de part et d'autre pour basculer entre les 2 missions -->
      <div class="stage-switch reveal">
        <button class="stage-arrow" id="stagePrev" type="button" aria-label="" data-i18n-attr="aria-label=stages.aria_label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <div class="stage-head">
          <span class="stage-count" id="stageCount" data-i18n="stages.stage_count"></span>
          <h3 class="stage-name" id="stageName" data-i18n="stages.stage_name"></h3>
          <span class="stage-meta" id="stageMeta" data-i18n="stages.stage_meta"></span>
        </div>
        <button class="stage-arrow" id="stageNext" type="button" aria-label="" data-i18n-attr="aria-label=stages.aria_label_2">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
      <div class="stage-dots">
        <button class="stage-dot active" type="button" data-stage="0" aria-label="" data-i18n-attr="aria-label=stages.aria_label_3"></button>
        <button class="stage-dot" type="button" data-stage="1" aria-label="" data-i18n-attr="aria-label=stages.aria_label_4"></button>
      </div>

      <div class="stage-panels" id="stagePanels">

        <!-- ── STAGE 1 : Lycée LMR / Solution GLPI ── -->
        <div class="stage-panel" data-stage="0">
          <div class="timeline">
            <div class="tl-rail" aria-hidden="true"><i></i></div>

            <div class="tl-item">
              <div class="tl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg></div>
              <div class="tl-content">
                <span class="tl-step" data-i18n="stages.etape"></span>
                <h3 class="tl-title" data-i18n="stages.etape_titre"></h3>
                <p class="tl-desc" data-i18n="stages.etape_texte"></p>
              </div>
              <span class="tl-kanji" aria-hidden="true">壱</span>
            </div>

            <div class="tl-item">
              <div class="tl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg></div>

                <h3 class="tl-title" data-i18n="stages.etape_titre_2"></h3>
                <p class="tl-desc" data-i18n="stages.etape_texte_2"></p>
              </div>
              <span class="tl-kanji" aria-hidden="true">弐</span>

            <div class="tl-item">
              <div class="tl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div>

            </div>

            <div class="tl-item">
              <div class="tl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg></div>
              <div class="tl-content">
                <span class="tl-step" data-i18n="stages.etape_4"></span>
                <h3 class="tl-title" data-i18n="stages.etape_titre_4"></h3>
                <p class="tl-desc" data-i18n-html="stages.etape_texte_4"></p>
              </div>
              <span class="tl-kanji" aria-hidden="true">肆</span>
            </div>

            <div class="tl-item">
              <div class="tl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg></div>
              <div class="tl-content">
                <span class="tl-step" data-i18n="stages.etape_5"></span>
                <h3 class="tl-title" data-i18n="stages.etape_titre_5"></h3>
                <p class="tl-desc" data-i18n="stages.etape_texte_5"></p>
              </div>
              <span class="tl-kanji" aria-hidden="true">伍</span>
            </div>
          </div>
        </div>

        <!-- ── STAGE 2 : Caledonia / Application multiplateforme ── -->
        <div class="stage-panel" data-stage="1" hidden>
          <div class="timeline">
            <div class="tl-rail" aria-hidden="true"><i></i></div>

            <div class="tl-item">
              <div class="tl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"></path><rect x="9" y="3" width="6" height="4" rx="1"></rect><line x1="9" y1="12" x2="15" y2="12"></line><line x1="9" y1="16" x2="13" y2="16"></line></svg></div>
              <div class="tl-content">
                <span class="tl-step" data-i18n="stages.etape_6"></span>
                <h3 class="tl-title" data-i18n="stages.etape_titre_6"></h3>
                <p class="tl-desc" data-i18n="stages.etape_texte_6"></p>
              </div>
              <span class="tl-kanji" aria-hidden="true">壱</span>
            </div>

            <div class="tl-item">
              <div class="tl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg></div>

                <h3 class="tl-title" data-i18n="stages.etape_titre_7"></h3>

              </div>
              <span class="tl-kanji" aria-hidden="true">弐</span>
            </div>

            <div class="tl-item">
              <div class="tl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg></div>

                <h3 class="tl-title" data-i18n="stages.etape_titre_8"></h3>

              <div class="tl-content">
                <span class="tl-step" data-i18n="stages.etape_9"></span>
                <h3 class="tl-title" data-i18n="stages.etape_titre_9"></h3>

              </div>
              <span class="tl-kanji" aria-hidden="true">肆</span>
            </div>

            <div class="tl-item">
              <div class="tl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg></div>
              <div class="tl-content">
